plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'lapisteam.kurampa'
version = '1.5.0'

def paperApiVersion = providers.gradleProperty('paperApiVersion')
        .getOrElse('1.20.1-R0.1-SNAPSHOT')

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
}

dependencies {
    // Compile against the oldest supported API by default. CI also compiles against
    // the newest stable API to catch removed/renamed methods and constants.
    compileOnly("io.papermc.paper:paper-api:${paperApiVersion}")
    implementation('org.xerial:sqlite-jdbc:3.51.2.0')
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
}

tasks.named('processResources') {
    def properties = [version: project.version]
    inputs.properties(properties)
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(properties)
    }
}

// The deployable artifact must include SQLite. Keep the thin jar clearly labeled.
tasks.named('jar') {
    archiveClassifier.set('unshaded')
}
tasks.named('shadowJar') {
    archiveClassifier.set('')
    // SQLite's native libraries are loaded by resource path; do not relocate org.sqlite.
    mergeServiceFiles()
}
tasks.named('build') {
    dependsOn(tasks.named('shadowJar'))
}
